map $http_user_agent $is_crawler {
    default 0;
    "~*facebookexternalhit" 1;
    "~*Facebot" 1;
    "~*Twitterbot" 1;
    "~*LinkedInBot" 1;
    "~*Slackbot" 1;
    "~*Discordbot" 1;
    "~*TelegramBot" 1;
    "~*WhatsApp" 1;
    "~*Googlebot" 1;
    "~*bingbot" 1;
    "~*Applebot" 1;
    "~*Pinterest" 1;
}

server {
    listen 80;
    server_name fairy.krz-tech.net;
    root /usr/share/nginx/html;
    index index.html;

    # Route for research pages with UUID pattern - crawler gets redirected to OGP endpoint
    location ~ "^/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
        # If SNS crawler, redirect to backend OGP endpoint (307 preserves method)
        if ($is_crawler = 1) {
            return 307 ${BACKEND_API_URL}/api/research/$$1/ogp;
        }
        
        # Regular users get the SPA
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
