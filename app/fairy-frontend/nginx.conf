map $http_user_agent $is_crawler {
    default 0;
    "~*facebookexternalhit" 1;
    "~*Facebot" 1;
    "~*Twitterbot" 1;
    "~*LinkedInBot" 1;
    "~*Slackbot" 1;
    "~*Discordbot" 1;
    "~*TelegramBot" 1;
    "~*WhatsApp" 1;
    "~*Googlebot" 1;
    "~*bingbot" 1;
    "~*Applebot" 1;
    "~*Pinterest" 1;
}

server {
    listen 80;
    server_name fairy.krz-tech.net;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver for Docker/K8s DNS (required for proxy_pass with variables)
    resolver 127.0.0.11 10.43.0.10 valid=30s;

    # Route for research pages with UUID pattern - crawler gets OGP
    location ~ "^/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
        set $uuid $1;
        
        # If SNS crawler, return 418 to trigger error_page
        if ($is_crawler = 1) {
            return 418;
        }
        
        # Regular users get the SPA
        try_files $uri $uri/ /index.html;
        
        # Handle 418 by proxying to backend OGP
        error_page 418 = @ogp_proxy;
    }

    # Named location for OGP proxy
    location @ogp_proxy {
        # Use environment variable for backend URL (substituted at container start)
        set $backend "${BACKEND_API_URL}";
        proxy_pass $backend/api/research/$uuid/ogp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
