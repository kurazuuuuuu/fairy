---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data-pvc
  namespace: argocd-prod
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairy-backend-api
  namespace: argocd-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fairy-backend-api
  template:
    metadata:
      labels:
        app: fairy-backend-api
    spec:
      imagePullSecrets:
      - name: ghcr-registry-secret
      containers:
      # Ollama sidecar container
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "ollama pull gemma3:1b || true"]
      # Backend API container
      - name: fairy-backend-api
        image: ghcr.io/kurazuuuuuu/fairy-backend-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: gemini-api-key
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: mongodb-uri
        - name: CORS_ORIGINS
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: cors-origins
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: jwt-secret
        - name: BASE_URL
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: base-url
        - name: FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: frontend-url
        - name: APP_VERSION
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: app-version
        - name: OLLAMA_HOST
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: ollama-host
        - name: GEMMA_MODEL
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: gemma-model
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fairy-backend-api-internal
  namespace: argocd-prod
spec:
  selector:
    app: fairy-backend-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: fairy-backend-api-external
  namespace: argocd-prod
spec:
  selector:
    app: fairy-backend-api
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer
  loadBalancerIP: 192.168.1.24
