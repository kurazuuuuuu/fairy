---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data-pvc
  namespace: argocd-prod
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairy-backend-ollama
  namespace: argocd-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fairy-backend-ollama
  template:
    metadata:
      labels:
        app: fairy-backend-ollama
    spec:
      imagePullSecrets:
      - name: ghcr-registry-secret
      containers:
      # Ollama sidecar container
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "ollama pull ${GEMMA_MODEL} || true; ollama serve", "echo GEMMA_MODEL: ${GEMMA_MODEL}"]
        env:
        - name: GEMMA_MODEL
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: gemma-model
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fairy-backend-ollama-internal
  namespace: argocd-prod
spec:
  selector:
    app: fairy-backend-ollama
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP