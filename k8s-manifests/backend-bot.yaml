---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairy-backend-bot
  namespace: argocd-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fairy-backend-bot
  template:
    metadata:
      labels:
        app: fairy-backend-bot
    spec:
      imagePullSecrets:
      - name: ghcr-registry-secret
      containers:
      - name: fairy-backend-bot
        image: ghcr.io/kurazuuuuuu/fairy-backend-bot:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        env:
        - name: DISCORD_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: discord-bot-token
        - name: BACKEND_INTERNAL_URL
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: backend-internal-url
        - name: APP_VERSION
          valueFrom:
            secretKeyRef:
              name: fairy-secrets
              key: app-version
