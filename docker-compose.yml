services:
  fairy-backend-api:
    build:
      context: ./app/fairy-backend-api
      dockerfile: Dockerfile
    command: ["uv", "run", "fastapi", "run", "main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - BASE_URL=${BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - APP_VERSION=${APP_VERSION}
    restart: unless-stopped
    depends_on:
      fairy-mongodb:
        condition: service_started

  fairy-backend-bot:
    build:
      context: ./app/fairy-backend-bot
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "main.py"]
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - BACKEND_INTERNAL_URL=http://fairy-backend-api:8000
      - APP_VERSION=${APP_VERSION}
    restart: unless-stopped
    depends_on:
      - fairy-backend-api

  fairy-mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  fairy-frontend:
    build:
      context: ./app/fairy-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL}
      - VITE_DISCORD_INVITE_URL=${VITE_DISCORD_INVITE_URL}
    restart: unless-stopped

volumes:
  mongodb_data:
